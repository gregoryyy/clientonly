<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>WebLLM — Simple Client-side Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div class="wrap">
  <h2 class="headline">WebLLM — Client-Side Chat</h2>
  <div class="toolbar">
    <div class="row grow">
      <label for="model">Model</label>
      <select id="model"></select>
      <button class="btn" id="loadBtn">Load model</button>
      <span id="status" class="status">WebGPU: <span id="gpu"></span></span>
    </div>
    <div class="kvs">
      <div class="slider">
        <label for="temp">Temp</label>
        <input id="temp" type="range" min="0" max="2" step="0.1" value="0.7" />
        <span id="tempVal" class="pill">0.7</span>
      </div>
      <button class="btn secondary" id="newChatBtn" title="Start a fresh chat">New chat</button>
      <button class="btn danger" id="clearBtn" title="Clear stored chats for this model">Clear saved</button>
    </div>
  </div>

  <div class="system-block">
    <label for="system" class="dim">System prompt</label>
    <textarea id="system" rows="2" placeholder="You are a helpful assistant that answers concisely."></textarea>
  </div>

  <div class="chat">
    <div id="messages" class="messages"></div>
    <div class="composer">
      <textarea id="input" placeholder="Type your message… (Shift+Enter for newline, Enter to send)"></textarea>
      <div class="button-stack">
        <button class="btn" id="sendBtn">Send</button>
        <button class="btn danger" id="stopBtn" disabled>Stop</button>
      </div>
    </div>
  </div>

  <p class="meta">Runs entirely in your browser via <a href="https://github.com/mlc-ai/web-llm" target="_blank" rel="noreferrer">WebLLM</a>. Nothing leaves your device.</p>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
